<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="AstroGeo social preview">
  <title>AstroGeo - GitHub 仓库社交预览图 1280×640</title>
  <defs>
    <linearGradient id="sBanner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061224"/>
      <stop offset="52%" stop-color="#0A1E3C"/>
      <stop offset="100%" stop-color="#0D3057"/>
    </linearGradient>
    <radialGradient id="sHalo" cx="26%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#2FC8DB" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2FC8DB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sBg" cx="50%" cy="28%" r="82%">
      <stop offset="0%" stop-color="#163E73"/>
      <stop offset="52%" stop-color="#0A1E3C"/>
      <stop offset="100%" stop-color="#040A14"/>
    </radialGradient>
    <radialGradient id="sHalo2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2FC8DB" stop-opacity="0.30"/>
      <stop offset="65%" stop-color="#2FC8DB" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#2FC8DB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sGlobe" cx="34%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#2E76C4"/>
      <stop offset="55%" stop-color="#123A6B"/>
      <stop offset="100%" stop-color="#061529"/>
    </radialGradient>
    <linearGradient id="sWave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5FE0EF" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#1B4F8F" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="sHorizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2FC8DB" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2FC8DB" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sClipGlobe"><circle cx="256" cy="266" r="130"/></clipPath>
    <clipPath id="sClipCanvas"><rect width="1280" height="640"/></clipPath>
  </defs>

  <g clip-path="url(#sClipCanvas)">
    <rect width="1280" height="640" fill="url(#sBanner)"/>
    <rect width="1280" height="640" fill="url(#sHalo)"/>

    <!-- star field -->
    <g fill="#DCEBFF">
      <circle cx="118" cy="92" r="2.6" opacity="0.6"/>
      <circle cx="336" cy="64" r="2" opacity="0.45"/>
      <circle cx="612" cy="112" r="2.4" opacity="0.5"/>
      <circle cx="884" cy="74" r="2.8" opacity="0.55"/>
      <circle cx="1064" cy="140" r="2.2" opacity="0.45"/>
      <circle cx="1214" cy="86" r="2.4" opacity="0.4"/>
      <circle cx="946" cy="216" r="2" opacity="0.32"/>
      <circle cx="1128" cy="286" r="2.2" opacity="0.3"/>
      <circle cx="66" cy="500" r="2.2" opacity="0.35"/>
      <circle cx="1236" cy="486" r="2.2" opacity="0.32"/>
    </g>
    <g stroke="#7FE3EE" stroke-opacity="0.4" stroke-width="2" fill="none">
      <path d="M 1086 96 L 1128 70 L 1148 116 L 1106 138 Z"/>
    </g>
    <g fill="#EAF7FF">
      <circle cx="1086" cy="96" r="4"/>
      <circle cx="1128" cy="70" r="3.4"/>
      <circle cx="1148" cy="116" r="3"/>
      <circle cx="1106" cy="138" r="2.8"/>
    </g>
    <path d="M 806 128 Q 810 152 834 156 Q 810 160 806 184 Q 802 160 778 156 Q 802 152 806 128 Z" fill="#FFC24B" opacity="0.9"/>

    <!-- horizon -->
    <ellipse cx="640" cy="614" rx="950" ry="152" fill="url(#sHorizon)"/>
    <path d="M -20 618 q 90 -30 180 0 t 180 0 t 180 0 t 180 0 t 180 0 t 180 0 t 180 0 t 180 0 L 1340 700 L -20 700 Z" fill="#1E7FB8" fill-opacity="0.22"/>
    <path d="M -20 650 q 90 -26 180 0 t 180 0 t 180 0 t 180 0 t 180 0 t 180 0 t 180 0 t 180 0 L 1340 720 L -20 720 Z" fill="#14548C" fill-opacity="0.32"/>

    <!-- emblem tile -->
    <g transform="translate(76,145) scale(0.68359375)">
      <rect width="512" height="512" rx="112" fill="url(#sBg)"/>
      <circle cx="256" cy="266" r="206" fill="url(#sHalo2)"/>
      <circle cx="256" cy="256" r="198" fill="none" stroke="#2FC8DB" stroke-opacity="0.15" stroke-width="3"/>
      <g fill="#DCEBFF">
        <circle cx="92" cy="116" r="3.2" opacity="0.72"/>
        <circle cx="404" cy="128" r="2.4" opacity="0.50"/>
        <circle cx="118" cy="396" r="2.6" opacity="0.48"/>
        <circle cx="396" cy="382" r="3.0" opacity="0.58"/>
        <circle cx="204" cy="66" r="2.2" opacity="0.42"/>
        <circle cx="336" cy="444" r="2.2" opacity="0.38"/>
      </g>
      <circle cx="256" cy="266" r="130" fill="url(#sGlobe)"/>
      <g clip-path="url(#sClipGlobe)">
        <g fill="none" stroke="#7FE3EE" stroke-opacity="0.38" stroke-width="3">
          <line x1="126" y1="266" x2="386" y2="266"/>
          <ellipse cx="256" cy="266" rx="130" ry="46"/>
          <ellipse cx="256" cy="266" rx="130" ry="94"/>
          <ellipse cx="256" cy="266" rx="46" ry="130"/>
          <ellipse cx="256" cy="266" rx="94" ry="130"/>
        </g>
        <path d="M 96 336 q 26 -13 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0 L 424 440 L 96 440 Z" fill="url(#sWave)"/>
        <path d="M 96 362 q 26 13 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0 L 424 444 L 96 444 Z" fill="#1E6FA8" fill-opacity="0.62"/>
        <path d="M 96 386 q 26 -11 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0 L 424 448 L 96 448 Z" fill="#0C3A66" fill-opacity="0.70"/>
      </g>
      <circle cx="256" cy="266" r="130" fill="none" stroke="#8FE9F5" stroke-opacity="0.70" stroke-width="4"/>
      <g transform="rotate(-28 256 266)">
        <ellipse cx="256" cy="266" rx="196" ry="62" fill="none" stroke="#2FC8DB" stroke-width="6" stroke-opacity="0.92"/>
        <circle cx="83" cy="266" r="10" fill="#EAF7FF"/>
      </g>
      <path d="M 429 144 Q 434.4 168.6 459 174 Q 434.4 179.4 429 204 Q 423.6 179.4 399 174 Q 423.6 168.6 429 144 Z" fill="#FFC24B"/>
    </g>
    <rect x="76" y="145" width="350" height="350" rx="76.6" fill="none" stroke="#2FC8DB" stroke-opacity="0.22" stroke-width="2"/>

    <!-- wordmark -->
    <text x="470" y="336" fill="#F2F7FF"
          font-family="Segoe UI Semibold, Segoe UI, Inter, Helvetica, Arial, sans-serif"
          font-weight="700" font-size="146" letter-spacing="1">Astro<tspan fill="#2FC8DB">Geo</tspan></text>

    <!-- institution: full English name -->
    <text x="474" y="400" fill="#7FE3EE" fill-opacity="0.82"
          font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
          font-size="22">NORTH CHINA UNIVERSITY OF WATER RESOURCES AND ELECTRIC POWER</text>
  </g>
</svg>
