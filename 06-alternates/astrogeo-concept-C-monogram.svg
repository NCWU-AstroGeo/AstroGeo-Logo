<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AstroGeo - Monogram A">
  <title>AstroGeo - 单色字母 A</title>
  <defs>
    <radialGradient id="cBg" cx="50%" cy="26%" r="84%">
      <stop offset="0%" stop-color="#12345F"/>
      <stop offset="58%" stop-color="#081A33"/>
      <stop offset="100%" stop-color="#040A14"/>
    </radialGradient>
    <linearGradient id="cCounter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2FC8DB" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#2FC8DB" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#cBg)"/>
  <circle cx="256" cy="256" r="198" fill="none" stroke="#2FC8DB" stroke-opacity="0.13" stroke-width="3"/>

  <!-- background stars -->
  <g fill="#DCEBFF">
    <circle cx="116" cy="138" r="3" opacity="0.7"/>
    <circle cx="402" cy="148" r="2.4" opacity="0.5"/>
    <circle cx="128" cy="376" r="2.4" opacity="0.45"/>
    <circle cx="394" cy="364" r="2.8" opacity="0.55"/>
  </g>

  <!-- counter glow (legs overpaint the bleed) -->
  <path d="M 256 188 L 206 302 L 306 302 Z" fill="url(#cCounter)"/>

  <!-- stars inside the counter -->
  <g fill="#9FE8F3">
    <circle cx="246" cy="284" r="4.6"/>
    <circle cx="268" cy="292" r="3"/>
  </g>

  <!-- letter A -->
  <path d="M 152 396 L 256 172 L 360 396" fill="none" stroke="#F2F7FF" stroke-width="46"
        stroke-linecap="butt" stroke-linejoin="miter"/>

  <!-- crossbar -->
  <path d="M 178 308 L 334 308" fill="none" stroke="#2FC8DB" stroke-width="24"/>

  <!-- star at the apex -->
  <path d="M 256 100 Q 261 132 293 137 Q 261 142 256 174 Q 251 142 219 137 Q 251 132 256 100 Z" fill="#FFC24B"/>
</svg>
