<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AstroGeo - Astral A">
  <title>AstroGeo - 方案 D 星环 A</title>
  <defs>
    <radialGradient id="dBg" cx="50%" cy="26%" r="84%">
      <stop offset="0%" stop-color="#12345F"/>
      <stop offset="58%" stop-color="#081A33"/>
      <stop offset="100%" stop-color="#040A14"/>
    </radialGradient>
    <linearGradient id="dCounter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2FC8DB" stop-opacity="0.44"/>
      <stop offset="100%" stop-color="#2FC8DB" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#dBg)"/>
  <circle cx="256" cy="256" r="198" fill="none" stroke="#2FC8DB" stroke-opacity="0.12" stroke-width="3"/>

  <g fill="#DCEBFF">
    <circle cx="110" cy="146" r="3" opacity="0.65"/>
    <circle cx="408" cy="140" r="2.4" opacity="0.5"/>
    <circle cx="124" cy="386" r="2.4" opacity="0.45"/>
    <circle cx="398" cy="372" r="2.8" opacity="0.55"/>
  </g>

  <!-- counter glow -->
  <path d="M 256 188 L 206 302 L 306 302 Z" fill="url(#dCounter)"/>
  <g fill="#9FE8F3">
    <circle cx="246" cy="284" r="4.6"/>
    <circle cx="268" cy="292" r="3"/>
  </g>

  <!-- letter A -->
  <path d="M 152 396 L 256 172 L 360 396" fill="none" stroke="#F2F7FF" stroke-width="46"
        stroke-linecap="butt" stroke-linejoin="miter"/>

  <!-- orbit ring threaded through the A -->
  <g transform="rotate(-8 256 306)">
    <ellipse cx="256" cy="306" rx="196" ry="30" fill="none" stroke="#2FC8DB" stroke-width="11"/>
    <circle cx="60" cy="306" r="10" fill="#EAF7FF"/>
  </g>

  <!-- star at the apex -->
  <path d="M 256 100 Q 261 132 293 137 Q 261 142 256 174 Q 251 142 219 137 Q 251 132 256 100 Z" fill="#FFC24B"/>
</svg>
